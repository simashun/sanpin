[package]
name = "sanpin"
version = "1.11.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
clap = { version = "4.5.50", features = ["derive"] }
encoding_rs = "0.8.35"

#[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_NetworkManagement_IpHelper", "Win32_Foundation", "Win32_System_Console"] }
ctrlc = "3.2"
# ICMP機能と基本的なAPI型に必要

#[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", features = ["pipewire"] }